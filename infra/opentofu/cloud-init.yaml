#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg

write_files:
  - path: /etc/systemd/system/shithead-game.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Shithead Card Game Server
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      Restart=on-failure
      RestartSec=15
      TimeoutStartSec=120
      TimeoutStopSec=65

      ExecStartPre=/usr/bin/docker stop shithead-game || true
      ExecStartPre=/usr/bin/docker rm shithead-game || true
      ExecStart=/usr/bin/docker run --name shithead-game --rm --log-driver=journald -p 127.0.0.1:3000:3000 --env-file /opt/shithead/.env ghcr.io/OWNER/shithead-server:latest
      ExecStop=/usr/bin/docker stop -t 60 shithead-game

      [Install]
      WantedBy=multi-user.target

  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    owner: root:root
    content: |
      # Configured by deployment pipeline

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Create application directory
  - mkdir -p /opt/shithead

  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Install Caddy
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy

  # Stop Caddy initially (will be configured during first deploy)
  - systemctl stop caddy

final_message: "Cloud-init complete. Docker and Caddy installed."
