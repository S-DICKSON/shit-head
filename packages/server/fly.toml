app = "shit-head-server"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # Uses production target

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # ALLOWED_ORIGINS set via fly secrets (contains CF Pages URL)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = 256
