services:
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    working_dir: /app/packages/client
    volumes:
      - ./packages/client:/app/packages/client
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/client/node_modules
      - /app/packages/shared/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./packages/server:/app/packages/server
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/server/node_modules
      - /app/packages/shared/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000

  e2e:
    build:
      context: .
      dockerfile: packages/e2e/Dockerfile
    working_dir: /app/packages/e2e
    volumes:
      - ./packages/e2e:/app/packages/e2e
      - /app/packages/e2e/node_modules
    environment:
      - E2E_BASE_URL=http://client:5173
    depends_on:
      - client
    profiles:
      - e2e
