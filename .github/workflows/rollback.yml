name: Rollback to Previous Version

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Git SHA to rollback to (short or full)'
        required: true
        type: string

jobs:
  rollback-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS and age
        run: |
          SOPS_VERSION=3.9.4
          AGE_VERSION=1.2.0
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen
          chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d --output-type json infra/secrets.sops.yaml | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Deploy rollback to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --image ghcr.io/${{ github.repository }}-server:prod-sha-${TARGET_SHA::7}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          FLY_API_TOKEN: ${{ env.fly_api_token }}

  rollback-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - name: Install SOPS and age
        run: |
          SOPS_VERSION=3.9.4
          AGE_VERSION=1.2.0
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen
          chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d --output-type json infra/secrets.sops.yaml | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client at target SHA
        run: cd packages/client && bunx vite build
        env:
          VITE_SERVER_URL: ${{ env.vite_server_url }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.cloudflare_api_token }}
          accountId: ${{ env.cloudflare_account_id }}
          command: pages deploy packages/client/dist --project-name=shit-head
