name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shithead-server

    steps:
      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          platforms: linux/arm64
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Deploy to Hetzner VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}
          DEPLOY_DOMAIN: splatmonkey.com
          DEPLOY_ORIGINS: https://splatmonkey.com
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          ssh -o StrictHostKeyChecking=no root@46.225.52.135 << ENDSSH
            # Login to GHCR (variables interpolated by runner before SSH)
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${GHCR_ACTOR} --password-stdin

            # Pull latest image
            docker pull ${DEPLOY_IMAGE}:latest

            # Write .env file for the container
            cat > /opt/shithead/.env << ENVEOF
          NODE_ENV=production
          PORT=3000
          ALLOWED_ORIGINS=${DEPLOY_ORIGINS}
          DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
          DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
          ENVEOF

            # Update systemd service with correct image
            sed -i "s|ghcr.io/OWNER/shithead-server|${DEPLOY_IMAGE}|g" /etc/systemd/system/shithead-game.service
            systemctl daemon-reload

            # Configure Caddy with domain
            cat > /etc/caddy/Caddyfile << CADDYEOF
          ${DEPLOY_DOMAIN} {
              reverse_proxy localhost:3000
              log {
                  output file /var/log/caddy/shithead.log
              }
          }
          CADDYEOF
            systemctl reload caddy || systemctl restart caddy

            # Restart game service
            systemctl enable shithead-game
            systemctl restart shithead-game

            # Wait for startup
            sleep 10

            # Health check
            curl -f http://localhost:3000/health || exit 1

            echo "Deployment successful!"
          ENDSSH

      - name: Post-deploy health check
        run: |
          sleep 5
          curl -f https://splatmonkey.com/health || echo "External health check failed (DNS/SSL may still be propagating)"
