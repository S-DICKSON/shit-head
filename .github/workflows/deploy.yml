name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-push-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=prod-sha-
          flavor: |
            latest=true

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS and age
        run: |
          SOPS_VERSION=3.9.4
          AGE_VERSION=1.2.0
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen
          chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d --output-type json infra/secrets.sops.yaml | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build client
        run: cd packages/client && bunx vite build
        env:
          VITE_SERVER_URL: ${{ env.vite_server_url }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.cloudflare_api_token }}
          accountId: ${{ env.cloudflare_account_id }}
          command: pages deploy packages/client/dist --project-name=shit-head

  deploy-server:
    runs-on: ubuntu-latest
    needs: build-push-server

    steps:
      - uses: actions/checkout@v4

      - name: Install SOPS and age
        run: |
          SOPS_VERSION=3.9.4
          AGE_VERSION=1.2.0
          curl -fsSL -o /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          chmod +x /usr/local/bin/sops
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin age/age age/age-keygen
          chmod +x /usr/local/bin/age /usr/local/bin/age-keygen

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops -d --output-type json infra/secrets.sops.yaml | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --config packages/server/fly.toml --image ghcr.io/${{ github.repository }}-server:prod-sha-${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ env.fly_api_token }}
