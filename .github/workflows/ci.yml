name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/ci.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared types
        run: bun run tsc --build packages/shared/tsconfig.json

      - name: Type-check client
        run: cd packages/client && bun run type-check

      - name: Type-check server
        run: cd packages/server && bun run tsc --noEmit

      - name: Lint shared
        run: cd packages/shared && bun run lint

      - name: Lint server
        run: cd packages/server && bun run lint

      - name: Lint client
        run: cd packages/client && bun run lint

      - name: Test client
        run: cd packages/client && bun run test

      - name: Test server
        run: cd packages/server && bun run test

      - name: Build client
        run: cd packages/client && bun run vite build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/e2e/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd packages/e2e && bunx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd packages/e2e && bunx playwright install-deps chromium

      - name: Run E2E tests
        run: cd packages/e2e && bunx playwright test
        env:
          CI: true
